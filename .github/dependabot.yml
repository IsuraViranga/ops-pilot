# Dependabot keeps dependencies current so that upgrades arrive as a stream of
# small, reviewable pull requests rather than one painful jump a year later.
#
# Updates are grouped: sixteen separate pull requests for sixteen patch bumps
# is how people start ignoring Dependabot entirely.

# Dependabot re-scans on the schedule below (and once immediately whenever this
# file changes). It does NOT scan on every push.
#
# What *does* happen on every push to main is a rebase of each open Dependabot
# pull request, and each rebase is a `synchronize` event that re-runs the
# workflows for that pull request. With five open pull requests that is roughly
# ten extra workflow runs per push, which is where the run count comes from.
#
# rebase-strategy: disabled stops that. Pull requests stay on the base they were
# opened against; rebase one deliberately with an `@dependabot rebase` comment,
# or use the Update branch button, when you are ready to merge it.

version: 2

updates:
  # --- Java backend -------------------------------------------------------
  - package-ecosystem: maven
    directory: /services/platform
    rebase-strategy: disabled
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    labels: [dependencies, backend]
    commit-message:
      prefix: "build"
      include: scope
    groups:
      spring:
        patterns: ["org.springframework*"]
      test-tooling:
        patterns: ["org.testcontainers*", "com.tngtech.archunit*", "org.assertj*", "org.mockito*"]
      build-plugins:
        patterns: ["*maven-plugin*", "com.diffplug.spotless*", "com.puppycrawl.tools*"]
      minor-and-patch:
        update-types: [minor, patch]

  # --- Frontend -----------------------------------------------------------
  - package-ecosystem: npm
    directory: /frontend
    rebase-strategy: disabled
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    labels: [dependencies, frontend]
    commit-message:
      prefix: "build"
      include: scope
    groups:
      next:
        patterns: ["next", "eslint-config-next", "@next/*"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      tooling:
        patterns: ["eslint*", "prettier*", "typescript", "tailwindcss", "@tailwindcss/*"]
      minor-and-patch:
        update-types: [minor, patch]
    # Two major upgrades are blocked upstream by eslint-config-next, so Dependabot
    # cannot produce a passing pull request for either however often it tries.
    # Both were reproduced locally before being ignored here, and both should be
    # revisited when eslint-config-next catches up.
    ignore:
      # Error: typescript-eslint does not support TS 7.0.
      # TypeScript 7 is the compiler rewrite. Tracking: typescript-eslint#10940.
      - dependency-name: typescript
        update-types: [version-update:semver-major]

      # TypeError: Error while loading rule 'react/display-name':
      #   contextOrFilename.getFilename is not a function
      # ESLint 10 removed the old rule context API. The eslint-plugin-react bundled
      # inside eslint-config-next still uses it, so linting crashes on any file.
      - dependency-name: eslint
        update-types: [version-update:semver-major]

  # --- GitHub Actions -----------------------------------------------------
  # An outdated action is a supply-chain risk as real as an outdated library.
  - package-ecosystem: github-actions
    directory: /
    rebase-strategy: disabled
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    labels: [dependencies, ci]
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  # --- Container images ---------------------------------------------------
  #
  # The PostgreSQL and Redis tags here are duplicated in AbstractIntegrationTest,
  # so that tests run against exactly the version development and production use.
  # Dependabot can only see the Compose file, so accepting one of these pull
  # requests means updating the test class in the same commit.
  #
  # Major versions are ignored on purpose: moving to PostgreSQL 18 is a migration
  # with a release plan, not a routine weekly bump.
  - package-ecosystem: docker-compose
    directory: /deployment/docker
    rebase-strategy: disabled
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    labels: [dependencies, infrastructure]
    commit-message:
      prefix: "build"
    ignore:
      - dependency-name: postgres
        update-types: [version-update:semver-major]
      - dependency-name: redis
        update-types: [version-update:semver-major]
