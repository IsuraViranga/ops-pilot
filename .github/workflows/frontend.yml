name: Frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Lint, type-check and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` rather than `npm install`: it installs exactly what the lockfile
      # says and fails if package.json and the lockfile disagree. A CI run must
      # never quietly resolve a different dependency tree than a developer has.
      - name: Install dependencies
        run: npm ci

      # Ordered cheapest-first, so the fastest failure arrives first.
      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          # The build must not depend on a reachable backend. The page fetches
          # health at request time, never at build time, which this proves.
          OPSPILOT_API_URL: http://localhost:8080
          NEXT_TELEMETRY_DISABLED: "1"
