name: Security

on:
  push:
    branches: [main]
  pull_request:
  # Dependencies do not change, but the list of known vulnerabilities does.
  # A weekly run catches a CVE published against code nobody has touched.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          # Gitleaks scans history, not just the current tree. A secret that was
          # committed and then removed is still a leaked secret.
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Note: Gitleaks Action is free for personal accounts. Repositories owned
          # by an organisation require GITLEAKS_LICENSE.

  dependencies:
    name: Dependency and config scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v7

      # Frontend only. Java dependencies are scanned in the Backend workflow from
      # the generated SBOM, because scanning a Maven project directly makes the
      # scanner resolve every POM from Maven Central and hit rate limits.
      - name: Scan frontend dependencies
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: frontend
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          skip-dirs: frontend/node_modules

      # Misconfiguration scan: Dockerfiles, Compose files and, from Phase 7,
      # Kubernetes manifests and Terraform.
      - name: Scan configuration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table

  codeql:
    name: CodeQL (${{ matrix.language }})
    # Code scanning is free on public repositories. On a private repository it
    # requires GitHub Advanced Security, so this job is skipped rather than
    # failing every run with a permissions error.
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      # Required to upload results to the Security tab.
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, javascript-typescript]

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Initialise CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # No compilation required: CodeQL analyses the source directly, which
          # avoids duplicating the Maven build already run by the Backend workflow.
          build-mode: none
          queries: security-and-quality

      - name: Analyse
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
